name: Build academic CV

on:
  push:
    branches: [main]
    paths:
      - 'cv/Raffaele_Mineo_Academic_CV.tex'
      - 'assets/raffaele-mineo.jpg'
      - '.github/workflows/build-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XeLaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-latex-extra texlive-fonts-recommended fonts-liberation

      - name: Build academic CV PDF
        shell: bash
        run: |
          set -euo pipefail
          cd cv
          xelatex -interaction=nonstopmode -halt-on-error Raffaele_Mineo_Academic_CV.tex
          xelatex -interaction=nonstopmode -halt-on-error Raffaele_Mineo_Academic_CV.tex
          rm -f *.aux *.log *.out

      - name: Commit generated PDF
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cv/Raffaele_Mineo_Academic_CV.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'Rebuild academic CV PDF'
            git push
          fi
