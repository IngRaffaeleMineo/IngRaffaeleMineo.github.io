name: Build profile artifacts

on:
  push:
    branches: [main]
    paths:
      - 'profile_private/Mineo_Raffaele_CV.tex'
      - 'profile_private/Mineo_Raffaele_NeutralPhoto.jpg'
      - 'profile_private/Mineo_Raffaele_EmailSignatureGenerator.py'
      - '.github/workflows/build-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XeLaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-latex-extra texlive-fonts-recommended fonts-liberation

      - name: Install Python dependencies
        run: python -m pip install --upgrade python-docx

      - name: Build email signature DOCX
        shell: bash
        run: |
          set -euo pipefail
          cd profile_private
          python Mineo_Raffaele_EmailSignatureGenerator.py

      - name: Build academic CV PDF
        shell: bash
        run: |
          set -euo pipefail
          cd profile_private
          xelatex -interaction=nonstopmode -halt-on-error Mineo_Raffaele_CV.tex
          xelatex -interaction=nonstopmode -halt-on-error Mineo_Raffaele_CV.tex
          cp Mineo_Raffaele_CV.pdf ../Mineo_Raffaele_CV.pdf
          rm -f *.aux *.log *.out *.pdf

      - name: Commit generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Mineo_Raffaele_CV.pdf profile_private/Mineo_Raffaele_EmailSignature.docx
          if ! git diff --cached --quiet; then
            git commit -m 'Rebuild profile artifacts'
            git pull --rebase origin main
            git push origin main
          fi
