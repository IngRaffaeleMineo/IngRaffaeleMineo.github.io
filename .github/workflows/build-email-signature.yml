name: Build email signature

on:
  push:
    branches: [main]
    paths:
      - 'profile_private/Mineo_Raffaele_EmailSignatureGenerator.py'
      - '.github/workflows/build-email-signature.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency
        run: python -m pip install python-docx

      - name: Generate formatted email signature
        run: |
          cd profile_private
          python Mineo_Raffaele_EmailSignatureGenerator.py

      - name: Commit generated DOCX
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile_private/Mineo_Raffaele_EmailSignature.docx
          if ! git diff --cached --quiet; then
            git commit -m 'Rebuild formatted email signature'
            git pull --rebase origin main
            git push origin main
          fi
